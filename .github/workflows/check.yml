# Tests on every push and pull request; a report card for every submission file a pull request adds or changes.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - name: Reference tool
        run: python -m pytest -q tests
      - name: Browser code against the reference tool
        run: node tests/test_parity.mjs
      - name: Report cards of changed submissions
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          for f in $(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'submissions/**/*.json'); do
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            python tools/check_submission.py "$f" --online >> "$GITHUB_STEP_SUMMARY" || true
          done
